name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd ember internal)"
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          skip-cache: true
      - name: Build commands
        run: make build
      - name: Race tests
        run: make race
      - name: Coverage
        run: make cover
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
      - name: Fuzz RESP decoder
        run: make fuzz FUZZTIME=5s
      - name: Build and start the container image
        run: |
          docker build --tag ember:ci .
          container=$(docker run --detach ember:ci)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            if docker logs "$container" 2>&1 | grep -F 'emberd listening' >/dev/null; then
              docker stop --time 10 "$container"
              exit 0
            fi
            sleep 0.2
          done
          docker logs "$container"
          exit 1
